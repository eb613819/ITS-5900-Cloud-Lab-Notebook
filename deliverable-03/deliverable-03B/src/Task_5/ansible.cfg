[defaults]
# Point to the inventory file generated by 'tofu apply'
inventory = inventory.yml

# Disable SSH host key checking for lab environments
# where VMs are freshly created and not in known_hosts
host_key_checking = False

# Use Python 3 explicitly
interpreter_python = /usr/bin/python3

[ssh_connection]
# Reduce SSH connection overhead in lab environments
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
